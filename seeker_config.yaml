behaviors:
  Seeker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256 # changed from 64 # v9: 256
      buffer_size: 4096 # changed from 2048 #v9 4096
      learning_rate: 3.0e-4 #v9 3.0e-4 # decreased for v10 for stable learning
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      num_layers: 3
      hidden_units: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 50000